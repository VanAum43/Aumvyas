<!DOCTYPE html>
<html>
<head>
    <title>Aumvyas</title>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #dbeafe, #f0fdf4);
            text-align: center;
            padding-top: 80px;
        }

        .box {
            background: white;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #aaa;
        }

        h1 {
            color: #2563eb;
        }

        input {
            padding: 10px;
            width: 80%;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin: 10px;
        }

        button {
            padding: 10px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #16a34a;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>🌸 Iris Flower AI</h1>

        <p>Enter Petal Length</p>

        <input id="petal" type="number" placeholder="Example: 3.5">

        <br>

        <button onclick="predict()">Predict</button>

        <div id="result"></div>

    </div>

    <script>
        function predict() {

            let petal = document.getElementById("petal").value;

            if (petal == "") {
                document.getElementById("result").innerHTML =
                    "Please enter a value";
            }

            else if (petal < 2) {
                document.getElementById("result").innerHTML =
                    "🌸 Iris Setosa";
            }

            else if (petal < 5) {
                document.getElementById("result").innerHTML =
                    "🌺 Iris Versicolor";
            }

            else {
                document.getElementById("result").innerHTML =
                    "🌷 Iris Virginica";
            }
        }
    </script>

</body>
</html>
